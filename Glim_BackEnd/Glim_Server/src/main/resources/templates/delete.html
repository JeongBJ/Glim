<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>글림(Glim) - 데이터 삭제 안내</title>

    <style>
        body{
            margin:0;
            background:#f6f7fb;
            font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
            color:#222;
        }

        .container{
            max-width:700px;
            margin:40px auto;
            padding:20px;
        }

        .card{
            background:white;
            border-radius:16px;
            padding:24px;
            box-shadow:0 6px 20px rgba(0,0,0,.08);
        }

        h1{
            margin-top:0;
            color:#4F46E5;
        }

        .section{
            margin-top:28px;
        }

        .path{
            margin-top:10px;
            padding:12px 16px;
            background:#f3f4f6;
            border-radius:10px;
            font-weight:600;
        }

        .footer{
            margin-top:32px;
            text-align:center;
            color:#666;
            font-size:14px;
        }

        a{
            color:#4F46E5;
            text-decoration:none;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>글림(Glim)</h1>

        <p>
            글림에서 작성한 게시물 및 계정 데이터를 삭제하는 방법을 안내드립니다.
        </p>

        <div class="section">
            <h2>🗑 게시물 삭제</h2>

            <div class="path">
                내 정보 → 글림 → 더보기(⋮) → 삭제
            </div>

            <p>
                삭제된 게시물은 복구할 수 없습니다.
            </p>
        </div>

        <div class="section">
            <h2>👤 계정 및 데이터 삭제</h2>

            <div class="path">
                내 정보 → 설정 → 회원 탈퇴
            </div>

            <p>
                회원 탈퇴 시 계정과 관련된 데이터는 삭제되며 복구할 수 없습니다.
            </p>
        </div>

        <div class="footer">
            문의<br>
            <a href="mailto:devjeongbj@gmail.com">
                devjeongbj@gmail.com
            </a>
        </div>

    </div>

</div>

</body>
</html>
