<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <title th:text="${title}">GLIM</title>

    <meta property="og:title" th:content="${title}" />
    <meta property="og:image" th:content="${image}" />
    <meta property="og:type" content="website" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: #fafafa;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
            padding: 24px;
        }

        .card {
            max-width: 420px;
            width: 100%;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0,0,0,.08);
        }

        .cover {
            width: 100%;
            aspect-ratio: 3 / 4;
            object-fit: cover;
        }

        .content {
            padding: 24px;
        }

        .quote {
            font-size: 20px;
            line-height: 1.6;
            color: #222;
            margin-bottom: 16px;
        }

        .book {
            color: #666;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .button {
            display: block;
            text-align: center;
            text-decoration: none;
            background: #111;
            color: white;
            padding: 14px;
            border-radius: 12px;
            font-weight: 600;
        }

        .loading {
            text-align: center;
            color: #888;
            margin-top: 16px;
            font-size: 13px;
        }
    </style>

    <script>
        setTimeout(() => {
            location.href =
                "intent://jeongbj.kro.kr/glim/share/" + [[${quoteSeq}]]
                + "#Intent;scheme=https;package=com.jeongbj.glim;end";
        }, 3000);
    </script>
</head>

<body>

<div class="card">
    <img
            class="cover"
            th:src="${image}"
            alt="책 표지"
    >

    <div class="content">
        <div class="book" th:text="${bookTitle}">
            책 제목
        </div>

        <div class="quote" th:text="${title}">
            명언 내용
        </div>

        <a class="button"
           th:href="|intent://jeongbj.kro.kr/glim/share/${quoteSeq}#Intent;scheme=https;package=com.jeongbj.glim;end|">
            GLIM 앱에서 보기
        </a>

        <div class="loading">
            잠시 후 GLIM 앱으로 이동합니다...
        </div>
    </div>
</div>

</body>
</html>
